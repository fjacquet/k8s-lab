all:
  children:
    rke2_cluster:
      children:
        rke2_servers:
          hosts:
            node-1:
              ansible_host: 172.16.86.101  # Replace with your server 1 IP
            node-2:
              ansible_host: 172.16.86.102  # Replace with your server 2 IP
            node-3:
              ansible_host: 172.16.86.103  # Replace with your server 3 IP
        rke2_agents:
          hosts:
            node-4:
              ansible_host: 172.16.86.104  # Replace with your agent 1 IP
            node-5:
              ansible_host: 172.16.86.105  # Replace with your agent 2 IP
  vars:
    ansible_user: ubuntu
    ansible_become: yes
    ansible_python_interpreter: /usr/bin/python3
    
    # RKE2 Configuration
    rke2_version: "v1.28.10+rke2r1"
    rke2_server_config:
      disable:
        - rke2-service-lb
      tls-san:
        - 172.16.86.101  # Replace with your server IPs
        - 172.16.86.102
        - 172.16.86.103
    
    # MetalLB Configuration
    metallb_ip_range: "172.16.86.200-172.16.86.210"
    
    # Domain Configuration
    domain: "ljf.home"
    acme_email: "admin@ljf.home"
    
    # Service Credentials (reference encrypted vault variables)
    minio_root_user: "admin"
    minio_root_pass: "{{ vault_minio_root_pass }}"
    n8n_admin_user: "admin"
    n8n_admin_pass: "{{ vault_n8n_admin_pass }}"
