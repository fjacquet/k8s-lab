driver:
  name: docker
platforms:
  - name: ubuntu
    image: ubuntu:20.04
    pre_build_image: true
    command: /bin/bash
    capabilities:
      - docker
provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
verifier:
  name: ansible
  playbooks:
    verify: verify.yml
  lint:
    name: ansible-lint
    enabled: true
    options:
      skip_list:
        - 'ANSIBLE0011'
        - 'ANSIBLE0012'
  options:
    lint: true
    lint_options:
      skip_list:
        - 'ANSIBLE0011'
        - 'ANSIBLE0012'