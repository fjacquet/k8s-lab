---
# Common role - Node prerequisites for RKE2 cluster
# Requirements: 1.1, 1.2, 2.4, 12.1

- name: Verify Ubuntu 24.04 LTS
  debug:
    msg: "Warning: Node is running {{ ansible_distribution }} {{ ansible_distribution_version }}, expected Ubuntu 24.04"
  when: ansible_distribution != "Ubuntu" or ansible_distribution_version != "24.04"

- name: Update APT cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - open-iscsi
      - curl
      - vim
      - ca-certificates
      - python3-pip
      - python3-kubernetes
      - git
      - keepalived  # Required for RKE2 HA mode
    state: present

- name: Download Helm installation script
  get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: '0700'
  when: inventory_hostname in groups['masters']

- name: Install Helm
  shell: /tmp/get_helm.sh
  when: inventory_hostname in groups['masters']
  register: helm_install_result
  changed_when: "'Helm' in helm_install_result.stdout"

- name: Enable and start iscsid service
  systemd:
    name: iscsid
    enabled: yes
    state: started

- name: Disable swap immediately
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Remove swap from fstab
  lineinfile:
    path: /etc/fstab
    regexp: '.*swap.*'
    state: absent

- name: Install resolvconf package
  apt:
    name: resolvconf
    state: present

- name: Create resolvconf head directory
  file:
    path: /etc/resolvconf/resolv.conf.d
    state: directory
    mode: '0755'

- name: Configure DNS nameserver in resolvconf
  lineinfile:
    path: /etc/resolvconf/resolv.conf.d/head
    line: "nameserver {{ dns_nameserver }}"
    create: yes
    mode: '0644'
  notify: update resolvconf

- name: Configure DNS search domain in resolvconf
  lineinfile:
    path: /etc/resolvconf/resolv.conf.d/head
    line: "search {{ dns_domain }}"
    create: yes
    mode: '0644'
  notify: update resolvconf

- name: Update resolvconf immediately
  command: resolvconf -u
  changed_when: false
