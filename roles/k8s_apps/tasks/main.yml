---
# tasks file for k8s_apps role
# This role deploys infrastructure and application services to the RKE2 cluster
# It operates in two phases: infrastructure and applications

- name: Validate deployment_phase variable
  fail:
    msg: "deployment_phase must be set to 'infrastructure' or 'applications'"
  when: deployment_phase not in ['infrastructure', 'applications']

- name: Set kubeconfig environment variable
  set_fact:
    kubeconfig_env: "{{ kubeconfig_path }}"

# ===== INFRASTRUCTURE PHASE =====
- name: Infrastructure services deployment
  when: deployment_phase == 'infrastructure'
  block:
    - name: Wait for Kubernetes API to be ready
      wait_for:
        host: "{{ ansible_host }}"
        port: 6443
        timeout: 300
        state: started
      register: api_wait_result

    - name: Display API readiness status
      debug:
        msg: "Kubernetes API is ready on {{ ansible_host }}:6443"

    - name: Patch kube-proxy for strictARP (required by MetalLB Layer 2 mode)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: patched
        kind: ConfigMap
        namespace: kube-system
        name: kube-proxy
        definition:
          data:
            config.conf: |
              apiVersion: kubeproxy.config.k8s.io/v1alpha1
              kind: KubeProxyConfiguration
              mode: "ipvs"
              ipvs:
                strictARP: true
      register: kubeproxy_patch_result

    - name: Display kube-proxy patch result
      debug:
        msg: "kube-proxy strictARP enabled for MetalLB Layer 2 mode"
      when: kubeproxy_patch_result is changed

    - name: Add Longhorn Helm repository
      kubernetes.core.helm_repository:
        name: longhorn
        repo_url: https://charts.longhorn.io
        state: present

    - name: Deploy Longhorn (distributed storage)
      kubernetes.core.helm:
        name: longhorn
        chart_ref: longhorn/longhorn
        chart_version: "{{ longhorn_version }}"
        release_namespace: "{{ longhorn_namespace }}"
        create_namespace: yes
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        wait: yes
        wait_timeout: 10m
      register: longhorn_deploy_result
      failed_when: false

    - name: Handle Longhorn deployment failure
      when: longhorn_deploy_result.failed | default(false)
      block:
        - name: Get Longhorn pods status for diagnostics
          kubernetes.core.k8s_info:
            kind: Pod
            namespace: "{{ longhorn_namespace }}"
            kubeconfig: "{{ kubeconfig_path }}"
          register: longhorn_pods_status
          ignore_errors: yes

        - name: Display Longhorn deployment failure diagnostics
          debug:
            msg:
              - "=========================================="
              - "Longhorn Deployment FAILED"
              - "=========================================="
              - "Error: {{ longhorn_deploy_result.msg | default('Unknown error') }}"
              - "Pods in {{ longhorn_namespace }}:"
              - "{{ longhorn_pods_status.resources | default([]) | map(attribute='metadata.name') | list }}"
              - "=========================================="

        - name: Fail with diagnostic information
          fail:
            msg: "Longhorn deployment failed. Check logs with: kubectl logs -n {{ longhorn_namespace }} -l app=longhorn-manager"

    - name: Verify Longhorn namespace exists
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ longhorn_namespace }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: longhorn_namespace_check
      failed_when: longhorn_namespace_check.resources | length == 0

    - name: Wait for Longhorn pods to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ longhorn_namespace }}"
        label_selectors:
          - "app=longhorn-manager"
        kubeconfig: "{{ kubeconfig_path }}"
        wait: yes
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 600
      register: longhorn_pods_ready

    - name: Display Longhorn deployment status
      debug:
        msg: "Longhorn deployed successfully in namespace {{ longhorn_namespace }} - All pods ready"

    - name: Add MetalLB Helm repository
      kubernetes.core.helm_repository:
        name: metallb
        repo_url: https://metallb.github.io/metallb
        state: present

    - name: Deploy MetalLB (load balancer)
      kubernetes.core.helm:
        name: metallb
        chart_ref: metallb/metallb
        chart_version: "{{ metallb_version }}"
        release_namespace: "{{ metallb_namespace }}"
        create_namespace: yes
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        wait: yes
        wait_timeout: 5m
      register: metallb_deploy_result
      failed_when: false

    - name: Handle MetalLB deployment failure
      when: metallb_deploy_result.failed | default(false)
      block:
        - name: Get MetalLB pods status for diagnostics
          kubernetes.core.k8s_info:
            kind: Pod
            namespace: "{{ metallb_namespace }}"
            kubeconfig: "{{ kubeconfig_path }}"
          register: metallb_pods_status
          ignore_errors: yes

        - name: Display MetalLB deployment failure diagnostics
          debug:
            msg:
              - "=========================================="
              - "MetalLB Deployment FAILED"
              - "=========================================="
              - "Error: {{ metallb_deploy_result.msg | default('Unknown error') }}"
              - "Pods in {{ metallb_namespace }}:"
              - "{{ metallb_pods_status.resources | default([]) | map(attribute='metadata.name') | list }}"
              - "=========================================="

        - name: Fail with diagnostic information
          fail:
            msg: "MetalLB deployment failed. Check logs with: kubectl logs -n {{ metallb_namespace }} -l app.kubernetes.io/name=metallb"

    - name: Verify MetalLB namespace exists
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ metallb_namespace }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: metallb_namespace_check
      failed_when: metallb_namespace_check.resources | length == 0

    - name: Display MetalLB deployment status
      debug:
        msg: "MetalLB deployed successfully in namespace {{ metallb_namespace }}"

    - name: Wait for MetalLB controller to be ready
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: "{{ metallb_namespace }}"
        name: metallb-controller
        kubeconfig: "{{ kubeconfig_path }}"
        wait: yes
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 300
      register: metallb_controller_status
      retries: 3
      delay: 10
      until: metallb_controller_status.resources[0].status.conditions | selectattr('type', 'equalto', 'Available') | selectattr('status', 'equalto', 'True') | list | length > 0

    - name: Wait for MetalLB speaker pods to be ready
      kubernetes.core.k8s_info:
        kind: DaemonSet
        namespace: "{{ metallb_namespace }}"
        name: metallb-speaker
        kubeconfig: "{{ kubeconfig_path }}"
      register: metallb_speaker_status
      retries: 30
      delay: 10
      until: >
        metallb_speaker_status.resources | length > 0 and
        metallb_speaker_status.resources[0].status.numberReady is defined and
        metallb_speaker_status.resources[0].status.desiredNumberScheduled is defined and
        metallb_speaker_status.resources[0].status.numberReady == metallb_speaker_status.resources[0].status.desiredNumberScheduled

    - name: Display MetalLB controller readiness
      debug:
        msg: "MetalLB controller and speaker pods are ready and available"

    - name: Create MetalLB IPAddressPool resource
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: default-pool
            namespace: "{{ metallb_namespace }}"
          spec:
            addresses:
              - "{{ metallb_ip_range }}"
      register: metallb_pool_result

    - name: Display MetalLB IPAddressPool status
      debug:
        msg: "MetalLB IPAddressPool created with range {{ metallb_ip_range }}"

    - name: Create MetalLB L2Advertisement resource
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: default-l2
            namespace: "{{ metallb_namespace }}"
          spec:
            ipAddressPools:
              - default-pool
      register: metallb_l2_result

    - name: Display MetalLB L2Advertisement status
      debug:
        msg: "MetalLB L2Advertisement configured for Layer 2 mode"

    - name: Add cert-manager Helm repository
      kubernetes.core.helm_repository:
        name: jetstack
        repo_url: https://charts.jetstack.io
        state: present

    - name: Deploy cert-manager (certificate management)
      kubernetes.core.helm:
        name: cert-manager
        chart_ref: jetstack/cert-manager
        chart_version: "{{ certmanager_version }}"
        release_namespace: "{{ certmanager_namespace }}"
        create_namespace: yes
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        wait: yes
        wait_timeout: 5m
        values:
          installCRDs: true
      register: certmanager_deploy_result
      failed_when: false

    - name: Handle cert-manager deployment failure
      when: certmanager_deploy_result.failed | default(false)
      block:
        - name: Get cert-manager pods status for diagnostics
          kubernetes.core.k8s_info:
            kind: Pod
            namespace: "{{ certmanager_namespace }}"
            kubeconfig: "{{ kubeconfig_path }}"
          register: certmanager_pods_status
          ignore_errors: yes

        - name: Display cert-manager deployment failure diagnostics
          debug:
            msg:
              - "=========================================="
              - "cert-manager Deployment FAILED"
              - "=========================================="
              - "Error: {{ certmanager_deploy_result.msg | default('Unknown error') }}"
              - "Pods in {{ certmanager_namespace }}:"
              - "{{ certmanager_pods_status.resources | default([]) | map(attribute='metadata.name') | list }}"
              - "=========================================="

        - name: Fail with diagnostic information
          fail:
            msg: "cert-manager deployment failed. Check logs with: kubectl logs -n {{ certmanager_namespace }} -l app.kubernetes.io/name=cert-manager"

    - name: Verify cert-manager namespace exists
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ certmanager_namespace }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: certmanager_namespace_check
      failed_when: certmanager_namespace_check.resources | length == 0

    - name: Wait for cert-manager pods to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ certmanager_namespace }}"
        label_selectors:
          - "app.kubernetes.io/name=cert-manager"
        kubeconfig: "{{ kubeconfig_path }}"
        wait: yes
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 300
      register: certmanager_pods_ready

    - name: Display cert-manager deployment status
      debug:
        msg: "cert-manager deployed successfully in namespace {{ certmanager_namespace }} - All pods ready"

    - name: Create Let's Encrypt Staging ClusterIssuer
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-staging
          spec:
            acme:
              server: "{{ certmanager_letsencrypt_server }}"
              email: "{{ acme_email }}"
              privateKeySecretRef:
                name: letsencrypt-staging
              solvers:
                - http01:
                    ingress:
                      class: nginx
      register: clusterissuer_result

    - name: Display ClusterIssuer status
      debug:
        msg: "Let's Encrypt Staging ClusterIssuer created with HTTP-01 solver"

    - name: Verify all infrastructure namespaces exist
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ item }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: namespace_verification
      failed_when: namespace_verification.resources | length == 0
      loop:
        - "{{ longhorn_namespace }}"
        - "{{ metallb_namespace }}"
        - "{{ certmanager_namespace }}"

    - name: Get all pods status in infrastructure namespaces
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ item }}"
        kubeconfig: "{{ kubeconfig_path }}"
      register: infrastructure_pods
      loop:
        - "{{ longhorn_namespace }}"
        - "{{ metallb_namespace }}"
        - "{{ certmanager_namespace }}"

    - name: Infrastructure deployment summary
      debug:
        msg:
          - "=========================================="
          - "Infrastructure Services Deployment Complete"
          - "=========================================="
          - "Longhorn: Deployed in {{ longhorn_namespace }}"
          - "MetalLB: Deployed in {{ metallb_namespace }} with IP range {{ metallb_ip_range }}"
          - "cert-manager: Deployed in {{ certmanager_namespace }}"
          - "ClusterIssuer: letsencrypt-staging configured"
          - "All infrastructure namespaces verified"
          - "All infrastructure pods are ready"
          - "=========================================="

